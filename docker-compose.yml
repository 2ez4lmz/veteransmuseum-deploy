version: '3.8'

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
      - '/etc/letsencrypt:/etc/letsencrypt'
    depends_on:
      - veteransmuseum.webapi
      - frontend
    networks:
      - veteransmuseum-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veteransmuseum-frontend
    networks:
      - veteransmuseum-net

  veteransmuseum.webapi:
    build:
      context: ./backend
      dockerfile: VeteransMuseum.WebApi/Dockerfile
    container_name: veteransmuseum-webapi
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=veteransmuseum-db;Port=5432;Database=veteransmuseum;Username=postgres;Password=postgres
    depends_on:
      veteransmuseum-db:
        condition: service_healthy
    networks:
      - veteransmuseum-net

  veteransmuseum-db:
    image: postgres:latest
    container_name: veteransmuseum-db
    environment:
      POSTGRES_DB: veteransmuseum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./backend/.containers/database:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - veteransmuseum-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  veteransmuseum-idp:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: veteransmuseum-idp
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "18080:8080"
    volumes:
      - ./backend/.files/bookify-realm-export.json:/opt/keycloak/data/import/bookify-realm-export.json
    command: start-dev --import-realm
    networks:
      - veteransmuseum-net

  keycloak-db:
    image: postgres:15
    container_name: veteransmuseum-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - ./backend/.containers/keycloak-db:/var/lib/postgresql/data
    networks:
      - veteransmuseum-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  veteransmuseum-seq:
    image: datalust/seq:latest
    container_name: veteransmuseum-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"
      - "8081:80"
    networks:
      - veteransmuseum-net

networks:
  veteransmuseum-net:
    driver: bridge
